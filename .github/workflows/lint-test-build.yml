name: Lint / Test / Build

on:
  pull_request:

  push:
    branches:
      - bm-develop


env:
  DEFAULT_NODE_VERSION: 16.x

permissions:
  contents: read
  packages: write

jobs:

  build:
    name: ${{ matrix.action }} (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [16.x, 18.x]
        action: [build, lint, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache node modules
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci
        if: steps.cache.outputs.cache-hit != 'true'

      - name: Set up QEMU
        if: matrix.action == 'build'
        id: qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        id: buildx
        if: matrix.action == 'build'
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Cache Docker layers
        id: cache-docker
        if: steps.buildx.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.node-version }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.node-version }}-

      - name: Docker cache size fix
        if: steps.cache-docker.outcome == 'success'
        run: |
          mv -v ${{ runner.temp }}/.buildx-cache ${{ runner.temp }}/.buildx-cache-old || true

      - name: Docker meta
        if: steps.buildx.outcome == 'success'
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_SET_OUTPUT_ENV: "true"
        with:
          images: |
            ghcr.io/${{ github.repository }}
            #${{ github.repository }}
          tags: |
            type=edge,branch=bm-develop
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      - name: Set variables for ci:build
        if: matrix.action == 'build'
        run: |
          echo $DOCKER_METADATA_OUTPUT_JSON | jq -r '"DOCKER_TAGS=-t " + (.tags | join(" -t "))' >> $GITHUB_ENV
          echo $DOCKER_METADATA_OUTPUT_JSON | jq -r '"REVISION=" + (.labels."org.opencontainers.image.revision")' >> $GITHUB_ENV
          echo $DOCKER_METADATA_OUTPUT_JSON | jq -r '"TAG_VERSION_NUMBER=" + (.labels."org.opencontainers.image.version")' >> $GITHUB_ENV
          echo $DOCKER_METADATA_OUTPUT_JSON | jq -r '"DATETIMENOW=" + (.labels."org.opencontainers.image.created")' >> $GITHUB_ENV
          #scope="buildx-${{ matrix.node-version }}-"
          #echo CACHE_ARGS="--cache-from=type=gha,scope=$scope --cache-to=type=gha,scope=$scope,mode=max" >> $GITHUB_ENV
          cachesrc="${{ runner.temp }}/.buildx-cache"
          echo CACHE_ARGS="--cache-from=type=local,src=$cachesrc-old --cache-to=type=local,dest=$cachesrc,mode=max" >> $GITHUB_ENV
          echo EXTRA_ARGS=--platform linux/amd64,linux/arm64 --push >> $GITHUB_ENV

      # FIXME this is disabled because we only have permission to run 'verified' actions
      # instead we must use the local cache, which needs to be manually cleared from time to time
      #- uses: peaceiris/actions-export-envs@v1.1.0
        #id: envs

      - name: Login to GitHub Container Registry
        if: matrix.action == 'build'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ci:${{ matrix.action }}
        shell: bash
        run: npm run ci:${{ matrix.action }}
        env:
          GITHASH: ${{ github.sha }}
          GITHUB_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.base_ref || 'bm-develop' }}
          NODE_VERSION: ${{ matrix.node-version }}
          #ACTIONS_RUNTIME_TOKEN: ${{ steps.envs.outputs.ACTIONS_RUNTIME_TOKEN }}
          #ACTIONS_CACHE_URL: ${{ steps.envs.outputs.ACTIONS_CACHE_URL }}
