name: Lint / Test / Build

on:
  pull_request:
  push:
    branches:
      - 8/set-up-ci


env:
  DEFAULT_NODE_VERSION: 16.x

permissions:
  contents: read
  #deployments: write
  #packages: write

jobs:

  build:
    name: ${{ matrix.action }} (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [16.x, 18.x]
        action: [lint, build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache node modules
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci
        if: steps.cache.outputs.cache-hit != 'true'

      - name: Set up Docker Buildx
        id: buildx
        if: matrix.action == 'build'
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      # Warning: At the moment, old cache entries aren't deleted, so the cache size keeps growing
      - name: Cache Docker layers
        if: steps.buildx.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.node-version }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.node-version }}-

      - name: Docker meta
        if: steps.buildx.outcome == 'success'
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_SET_OUTPUT_ENV: "true"
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      - name: Set variables for ci:build
        if: matrix.action == 'build'
        run: |
          echo $DOCKER_METADATA_OUTPUT_JSON | jq -r '"DOCKER_TAGS=-t " + (.tags | join(" -t "))' >> $GITHUB_ENV
          echo $DOCKER_METADATA_OUTPUT_JSON | jq -r '"REVISION=" + (.labels."org.opencontainers.image.revision")' >> $GITHUB_ENV
          echo $DOCKER_METADATA_OUTPUT_JSON | jq -r '"TAG_VERSION_NUMBER=" + (.labels."org.opencontainers.image.version")' >> $GITHUB_ENV
          echo $DOCKER_METADATA_OUTPUT_JSON | jq -r '"DATETIMENOW=" + (.labels."org.opencontainers.image.created")' >> $GITHUB_ENV
          #scope="buildx-${{ matrix.node-version }}-"
          #echo CACHE_ARGS="--cache-from=type=gha,scope=$scope --cache-to=type=gha,scope=$scope,mode=max" >> $GITHUB_ENV
          cachesrc="${{ runner.temp }}/.buildx-cache"
          echo CACHE_ARGS="--cache-from=type=local,src=$cachesrc --cache-to=type=local,dest=$cachesrc,mode=max" >> $GITHUB_ENV

      # FIXME this is disabled because we only have permission to run 'verified' actions
      # instead we must use the local cache, which needs to be manually cleared from time to time
      #- uses: peaceiris/actions-export-envs@v1.1.0
        #id: envs

      - name: ci:${{ matrix.action }}
        shell: bash
        run: npm run ci:${{ matrix.action }}
        env:
          GITHASH: ${{ github.sha }}
          GITHUB_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.base_ref || 'bm-develop' }}
          NODE_VERSION: ${{ matrix.node-version }}
          #ACTIONS_RUNTIME_TOKEN: ${{ steps.envs.outputs.ACTIONS_RUNTIME_TOKEN }}
          #ACTIONS_CACHE_URL: ${{ steps.envs.outputs.ACTIONS_CACHE_URL }}

      - name: Login to GitHub Container Registry
        if: matrix.action == 'build' && matrix.node-version == env.DEFAULT_NODE_VERSION
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        # FIXME disabled for now while we wait for permissions
        if: false && matrix.action == 'build' && matrix.node-version == env.DEFAULT_NODE_VERSION
        run: |
          export IMAGE_NAME=$(docker images --format {{.Repository}} | grep ghcr.io | head -n1)
          echo IMAGE_NAME=$IMAGE_NAME
          if [ ! "$IMAGE_NAME" == "" ]; then docker push "$IMAGE_NAME" --all-tags; fi
