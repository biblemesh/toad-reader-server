name: Lint / Test / Build

on:
  pull_request:

  push:
    branches:
      - bm-develop


env:
  DEFAULT_NODE_VERSION: 16.x

permissions:
  contents: read
  packages: write

jobs:

  build:
    name: ${{ matrix.action }} (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [16.x, 18.x]
        action: [build, lint, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache node modules
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci
        if: steps.cache.outputs.cache-hit != 'true'

      - name: Set up Docker Buildx
        id: buildx
        if: matrix.action == 'build'
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Docker meta
        if: steps.buildx.outcome == 'success'
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_SET_OUTPUT_ENV: "true"
        with:
          images: |
            ghcr.io/${{ github.repository }}
            #${{ github.repository }}
          tags: |
            type=edge,branch=bm-develop
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      - name: Set variables for ci:build
        if: matrix.action == 'build'
        run: |
          echo $DOCKER_METADATA_OUTPUT_JSON | jq -r '"DOCKER_TAGS=-t " + (.tags | join(" -t "))' >> $GITHUB_ENV
          echo $DOCKER_METADATA_OUTPUT_JSON | jq -r '"REVISION=" + (.labels."org.opencontainers.image.revision")' >> $GITHUB_ENV
          echo $DOCKER_METADATA_OUTPUT_JSON | jq -r '"TAG_VERSION_NUMBER=" + (.labels."org.opencontainers.image.version")' >> $GITHUB_ENV
          echo $DOCKER_METADATA_OUTPUT_JSON | jq -r '"DATETIMENOW=" + (.labels."org.opencontainers.image.created")' >> $GITHUB_ENV
          #scope="buildx-${{ matrix.node-version }}-"
          #echo CACHE_ARGS="--cache-from=type=gha,scope=$scope --cache-to=type=gha,scope=$scope,mode=max" >> $GITHUB_ENV
          echo CACHE_ARGS="--cache-from=type=gha --cache-to=type=gha,mode=max" >> $GITHUB_ENV
          echo EXTRA_ARGS=--platform linux/amd64,linux/arm64 --push >> $GITHUB_ENV

      - uses: actions/github-script@v6
        id: envs
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'])
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'])

      - name: Login to GitHub Container Registry
        if: matrix.action == 'build'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ci:${{ matrix.action }}
        shell: bash
        run: npm run ci:${{ matrix.action }}
        env:
          GITHASH: ${{ github.sha }}
          GITHUB_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.base_ref || 'bm-develop' }}
          NODE_VERSION: ${{ matrix.node-version }}
